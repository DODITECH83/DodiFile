<script>

<div id="app">
  <header class="top">
    <div class="brand"><span class="logo"><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="currentColor"/><path d="M168 120h130l86 86v178a16 16 0 0 1-16 16H168a16 16 0 0 1-16-16V136a16 16 0 0 1 16-16z" fill="#fff"/><path d="M298 120l86 86h-70a16 16 0 0 1-16-16z" fill="#B8CCF5"/><path d="M206 316l36 36 70-80" fill="none" stroke="#1D4ED8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></svg></span><b>DodiFile</b></div>
    <button class="ghost round" id="btnLockNow" aria-label="Blocca l'app ora" hidden><svg class="i"><use href="#i-lock"/></svg></button>
  </header>

  <main>
    <section class="view" id="view-home" data-view="home"></section>
    <section class="view" id="view-due" data-view="due" hidden></section>
    <section class="view" id="view-stats" data-view="stats" hidden></section>
    <section class="view" id="view-settings" data-view="settings" hidden></section>
  </main>

  <nav class="nav" aria-label="Navigazione principale">
    <button class="tab" data-tab="home" aria-current="page"><svg class="i"><use href="#i-archive"/></svg><span>Cassetto</span></button>
    <button class="tab" data-tab="due"><svg class="i"><use href="#i-calendar"/></svg><span>Scadenze</span><i class="badge" id="dueBadge" hidden></i></button>
    <button class="fab" id="btnScan" aria-label="Aggiungi un documento"><svg class="i"><use href="#i-scan"/></svg></button>
    <button class="tab" data-tab="stats"><svg class="i"><use href="#i-chart"/></svg><span>Riepilogo</span></button>
    <button class="tab" data-tab="settings"><svg class="i"><use href="#i-sliders"/></svg><span>Impostazioni</span></button>
  </nav>
</div>

<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileAny" accept="application/pdf,image/*" hidden>
<input type="file" id="fileRestore" accept="application/json,.json" hidden>

<dialog id="sheet" class="sheet" aria-label="Aggiungi un documento"></dialog>
<dialog id="detail" class="full" aria-label="Documento"></dialog>
<dialog id="crop" class="full" aria-label="Ritaglia"></dialog>
<dialog id="ask" class="alert" aria-label="Conferma"></dialog>
<dialog id="pin" class="alert" aria-label="PIN"></dialog>
<dialog id="onboard" class="full" aria-label="Benvenuto"></dialog>
<dialog id="busy" class="alert" aria-live="polite"><div class="busy"><div class="spin"></div><b id="busyMsg">Sto leggendo il documento…</b><span class="hint" id="busyHint"></span></div></dialog>

<div id="lock" hidden role="dialog" aria-modal="true" aria-label="App bloccata">
  <div class="lock-card">
    <span class="logo big"><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="currentColor"/><path d="M168 120h130l86 86v178a16 16 0 0 1-16 16H168a16 16 0 0 1-16-16V136a16 16 0 0 1 16-16z" fill="#fff"/><path d="M206 316l36 36 70-80" fill="none" stroke="#1D4ED8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <h1>DodiFile</h1>
    <p id="lockMsg" class="hint" aria-live="polite"></p>
    <div id="lockPad"></div>
    <button class="linkbtn" id="lockForgot">PIN dimenticato?</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="logic.js"></script>
<script src="store.js"></script>
<script src="lock.js"></script>
<script src="crop.js"></script>
<script src="app.js"></script>
</body>
</html>
